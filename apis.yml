name: Crosschq
description: 'Crosschq is a hiring intelligence platform that helps talent acquisition
  and people-analytics teams improve quality of hire. Its cloud product suite spans
  AI-powered interview agents, automated reference checks, candidate assessment and
  screening, identity and interview-fraud detection, and quality-of-hire analytics
  that tie hiring decisions back to on-the-job outcomes. Crosschq connects to major
  applicant tracking and HCM systems (Workday, SAP SuccessFactors, Greenhouse, iCIMS,
  Oracle, Lever, Ashby, Bullhorn, and others) through pre-built integrations rather
  than a public self-service API. Founded in Danville, California, the company is
  backed by Bessemer Venture Partners and GGV Capital.'
